name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Validate and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome>=2025.5.0"

      - name: Create throwaway secrets
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i 's|REPLACE_WITH_A_32_BYTE_BASE64_KEY=|'"$(head -c 32 /dev/urandom | base64)"'|' secrets.yaml

      - name: Validate configuration
        run: esphome config openhydronic-8ch.yaml

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome
          key: pio-${{ hashFiles('openhydronic-8ch.yaml') }}
          restore-keys: pio-

      - name: Compile firmware
        run: esphome compile openhydronic-8ch.yaml
