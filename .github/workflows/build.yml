name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Validate and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome>=2025.5.0"

      - name: Create throwaway secrets
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i 's|REPLACE_WITH_A_32_BYTE_BASE64_KEY=|'"$(head -c 32 /dev/urandom | base64)"'|' secrets.yaml

      - name: Validate configuration
        run: esphome config openhydronic-8ch.yaml

      # Only the toolchain is cached. The project's .esphome build directory
      # holds absolute paths from the runner that produced it, and restoring it
      # onto a runner with a different Python breaks the CMake generation.
      - name: Cache the ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-toolchain-${{ runner.os }}
          restore-keys: esphome-toolchain-

      - name: Compile firmware
        run: esphome compile openhydronic-8ch.yaml
