# OpenHydronic - Build and publish a GitHub release on every v*.*.* tag
# Copyright (C) 2026 David Lopes (https://github.com/davdlic)
# Licensed under the GNU General Public License v3.0
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

jobs:
  release:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache ESPHome toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-esphome-toolchain
          restore-keys: |
            ${{ runner.os }}-esphome-toolchain

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install "esphome>=2025.5.0"

      - name: Create release secrets
        run: |
          set -euo pipefail
          # The published binary carries the placeholders of the example file,
          # all public. Only the API key is replaced, and nobody keeps that one.
          cp secrets.yaml.example secrets.yaml
          sed -i "s|REPLACE_WITH_A_32_BYTE_BASE64_KEY=|$(head -c 32 /dev/urandom | base64)|" secrets.yaml

      - name: Build firmware
        run: esphome compile openhydronic-8ch.yaml

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          BUILD_DIR=.esphome/build/openhydronic/build
          OUT=release
          mkdir -p "$OUT"

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          cp "$BUILD_DIR/firmware.factory.bin" "$OUT/openhydronic-${TAG}-factory.bin"
          cp "$BUILD_DIR/firmware.ota.bin"     "$OUT/openhydronic-${TAG}-ota.bin"

          ( cd "$OUT" && sha256sum * > "openhydronic-${TAG}-SHA256SUMS.txt" )

          echo "Artifacts:"
          ls -lh "$OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: OpenHydronic ${{ steps.stage.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Flash `openhydronic-${{ steps.stage.outputs.tag }}-factory.bin` over serial from
            [ESPHome Web](https://web.esphome.io): the factory image carries the bootloader and
            the partition table, so every update after it can go over the air. The `-ota.bin`
            is for those later updates, through the board's own page or `esphome upload`.

            The published binary carries the placeholder credentials from `secrets.yaml.example`,
            all of them public: setup network `OpenHydronic-AP` / `openhydronic`, web login
            `admin` / `my-web-password`, OTA password `my-ota-password`. No real Wi-Fi matches the
            placeholder one, so after a minute the board brings up `OpenHydronic-AP` and asks for
            yours. Join it: the page your phone opens by itself, or `http://192.168.4.1` after the
            web login, saves your Wi-Fi.

            > Those placeholders are public. Before a board controls a real installation, build
            > your own with passwords in `secrets.yaml` and flash it over USB; later updates go
            > over the air.
            >
            > A Wi-Fi saved through the setup page is forgotten when the board is updated to a
            > build with a different configuration, and it returns to `OpenHydronic-AP`. Your own
            > builds avoid that by carrying your Wi-Fi in `secrets.yaml`.
          files: |
            release/*
